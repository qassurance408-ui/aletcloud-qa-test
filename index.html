<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AletCloud QA Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 48px;
      text-align: center;
      max-width: 480px;
      width: 90%;
    }

    .badge {
      display: inline-block;
      background: #1a5fa8;
      color: white;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      letter-spacing: 0.05em;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    p {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #0f172a;
      border: 1px solid #22c55e33;
      border-radius: 10px;
      padding: 14px 20px;
      font-size: 14px;
      color: #22c55e;
      font-weight: 500;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">AletCloud QA</div>
    <h1>Deployment Test</h1>
    <p>This page was deployed from GitHub to AletCloud App Hosting as part of the client-side QA test.</p>
    <p>This is to test the automatic rebuild and redeployment #3</p>
    <div class="status">
      <div class="dot"></div>
      Live and running
    </div>
  </div>
</body>
</html>
